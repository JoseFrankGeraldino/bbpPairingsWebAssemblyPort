# CI for bbpPairingsWebAssemblyPort.
# Jobs mirror the local commands in README.md ("CI jobs and their local
# equivalents"). Actions are pinned by commit SHA; only GitHub-provided actions.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: native build, test suites, tie-break comparison, dist
    runs-on: ubuntu-latest
    env:
      # The full generated set (300 random tournaments) runs here, on the
      # release build.
      BBP_GENERATED_COUNT: "300"
      # Generated tournaments per generator source compared with Gacrux.
      BBP_TIEBREAK_COUNT: "20"
    steps:
      - name: Checkout (with the engine submodule)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          fetch-depth: 0

      # Must match GACRUX_COMMIT in the Makefile; make gacrux verifies it.
      - name: Checkout Gacrux (tie-break reference, pinned)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: OttoMilvang/TieBreakServer
          ref: 49b01e67ccb2f94945fa97b97ade66a35584b341
          path: build/gacrux
          persist-credentials: false

      - name: Toolchain versions
        run: g++ --version && make --version | head -1 && python3 --version

      - name: Submodule is the pinned fork commit, unmodified
        run: |
          git submodule status
          test "$(git config -f .gitmodules submodule.third_party/bbpPairings.url)" = \
            "https://github.com/JoseFrankGeraldino/bbpPairings.git"
          test -z "$(git -C third_party/bbpPairings status --porcelain)"

      - name: Build (make native)
        run: make native

      - name: Engine suite and tie-break comparison (make test)
        run: make test ENGINE=build/native/bbpPairings

      - name: Package (make dist)
        run: make dist

      - name: Submodule still clean after build and tests
        run: test -z "$(git -C third_party/bbpPairings status --porcelain)"

      - name: Upload dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-linux-x64
          path: dist/native-linux-x64/
          if-no-files-found: error

  wasm:
    name: WebAssembly builds, suites on WASM, bridge, dist-wasm
    runs-on: ubuntu-latest
    env:
      # Fewer generated tournaments than the native job (each case starts
      # Node); the golden ones (seeds 1-20) and the parity group all run.
      BBP_GENERATED_COUNT: "100"
      BBP_TIEBREAK_COUNT: "5"
      # The Makefile sources it when em++ is not on PATH.
      EMSDK_ENV: ${{ github.workspace }}/build/emsdk/emsdk_env.sh
    steps:
      - name: Checkout (with the engine submodule)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          fetch-depth: 0

      # Must match GACRUX_COMMIT in the Makefile; make gacrux verifies it.
      - name: Checkout Gacrux (tie-break reference, pinned)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: OttoMilvang/TieBreakServer
          ref: 49b01e67ccb2f94945fa97b97ade66a35584b341
          path: build/gacrux
          persist-credentials: false

      # Emscripten SDK at its 7.0.0 release commit (EMSDK_VERSION in the
      # Makefile; tests/golden-wasm holds for this version).
      - name: Checkout emsdk (pinned)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: emscripten-core/emsdk
          ref: 1693ce7359fc9694f198694f902a2cc061239b86
          path: build/emsdk
          persist-credentials: false

      - name: Install Emscripten 7.0.0
        run: |
          build/emsdk/emsdk install 7.0.0
          build/emsdk/emsdk activate 7.0.0
          source "$EMSDK_ENV" > /dev/null && em++ --version | head -1 && node --version

      - name: WebAssembly builds (make wasm)
        run: make wasm

      - name: Engine suite, tie-break comparison and bridge on WASM (make test-wasm)
        run: make test-wasm

      - name: Package (make dist-wasm)
        run: make dist-wasm

      - name: Submodule still clean after build and tests
        run: test -z "$(git -C third_party/bbpPairings status --porcelain)"

      - name: Upload dist-wasm
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wasm
          path: dist/wasm/
          if-no-files-found: error

  coverage:
    name: coverage (gates 90% engine src, 85% tie-break tool)
    runs-on: ubuntu-latest
    env:
      # The coverage job only measures lines; the native job above runs the full
      # generated set. Measured 2026-11-08: 0, 40, 100 and 300 generated cases
      # all give the same 92.74% (4355/4696); 300 at -O0 + gcov took ~25 min on
      # the 2-vCPU runner. 20 keeps the generated path exercised instrumented.
      BBP_GENERATED_COUNT: "20"
      BBP_TIEBREAK_COVERAGE_COUNT: "5"
    steps:
      - name: Checkout (with the engine submodule)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          fetch-depth: 0

      # Must match GACRUX_COMMIT in the Makefile; make gacrux verifies it.
      - name: Checkout Gacrux (tie-break reference, pinned)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: OttoMilvang/TieBreakServer
          ref: 49b01e67ccb2f94945fa97b97ade66a35584b341
          path: build/gacrux
          persist-credentials: false

      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcovr

      - name: Instrumented build, suite, report and gate (make coverage)
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-report
          path: |
            build/coverage/report/
            build/coverage/tiebreak-report/
          if-no-files-found: error
